// TF2 Relay Client Configuration
// Place this file in addons/sourcemod/configs/

// ==============================================================================
// CONNECTION SETTINGS
// ==============================================================================

// Relay server hostname or IP address
// Default: "127.0.0.1"
sm_relay_host "127.0.0.1"

// Relay server port
// Default: 27050
sm_relay_port "27050"

// ==============================================================================
// SERVER IDENTIFICATION
// ==============================================================================

// Unique server identifier (1-4)
// Each server in your cluster must have a different ID
// Default: 1
sm_relay_server_id "1"

// Human-readable server name
// This appears in the relay TUI and in cross-server messages
// Default: "Server 1"
sm_relay_server_name "My TF2 Server"

// ==============================================================================
// CONNECTION BEHAVIOR
// ==============================================================================

// Reconnection delay in seconds when connection is lost
// Default: 5.0
sm_relay_reconnect_delay "5.0"

// Enable/disable relay functionality
// Set to 0 to temporarily disable without unloading the plugin
// Default: 1
sm_relay_enabled "1"
