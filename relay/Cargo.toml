[package]
name = "tf2-server-relay"
version = "1.0.0"
edition = "2021"
authors = ["vicentefelipechile"]
description = "High-performance relay server for cross-server TF2 communication"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/vicentefelipechile/tf2-server-relay"
keywords = ["tf2", "gameserver", "relay", "sourcemod"]
categories = ["games", "network-programming"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Byte buffer handling
bytes = "1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Configuration
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Terminal UI
ratatui = "0.29"
crossterm = "0.28"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1"

# Time handling
chrono = "0.4"

# Async utilities
futures = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
